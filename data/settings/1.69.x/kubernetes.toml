[[docs.ref.merge-default-eviction-settings]]
description = """
Controls whether kubelet keeps its default thresholds for hard-eviction signals that you do not set in `settings.kubernetes.eviction-hard`.
When `true`, you can set one signal, such as `memory.available`, and the other signals keep their kubelet defaults.
When `false` or unset, kubelet sets the signals that you leave out of `eviction-hard` to `0`, which disables them.
"""
accepted_values = [
    "`true`",
    "`false`"
]
default = "unset, which kubelet treats as `false`."
note = "This setting has an effect only on Kubernetes 1.33+ variants."
see = [
    ["[`mergeDefaultEvictionSettings` in Kubelet Configuration](https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/)"],
    ["settings", "kubernetes", "eviction-hard"]
]
[[docs.ref.merge-default-eviction-settings.example]]
comment = "Evict pods earlier under memory pressure and keep the default thresholds for the other signals."
direct_toml = """
[settings.kubernetes]
merge-default-eviction-settings = true

[settings.kubernetes.eviction-hard]
"memory.available" = "600Mi"
"""
direct_shell = """
apiclient set settings.kubernetes.merge-default-eviction-settings=true
"""
